services:
  # FastAPI Backend
  - type: web
    name: jobpilot-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DRY_RUN_MODE
        value: "true"
      - key: EMAIL_AUTOMATION_MODE
        value: "approval"
